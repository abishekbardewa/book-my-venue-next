name: Build and Push to ECR

on:
  push:
    branches:
      - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: bookmyvenue
  AWS_ROLE_ARN: arn:aws:iam::970387844150:role/BookMyVenueGitHubActions

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());

            console.log('repository:', payload.repository);
            console.log('ref:', payload.ref);
            console.log('sub:', payload.sub);
            console.log('aud:', payload.aud);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load production parameters
        shell: bash
        run: |
          aws ssm get-parameters-by-path \
            --path "/bookmyvenue/prod/" \
            --with-decryption \
            --recursive \
            --query 'Parameters[*].[Name,Value]' \
            --output text |
          while IFS=$'\t' read -r name value; do
            key="${name##*/}"
            printf '%s=%s\n' "$key" "$value"
          done > .env.build

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          secrets: |
            env=${{ github.workspace }}/.env.build

      - name: Remove temporary environment file
        if: always()
        run: rm -f .env.build
