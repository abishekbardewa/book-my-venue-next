name: Build and Push to ECR

on:
  push:
    branches:
      - prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: bookmyvenue
  AWS_ROLE_ARN: arn:aws:iam::970387844150:role/BookMyVenueGitHubActions

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Load production parameters
        shell: bash
        run: |
          set -euo pipefail

          aws ssm get-parameters-by-path \
            --path "/bookmyvenue/prod/" \
            --with-decryption \
            --recursive \
            --query 'Parameters[*].[Name,Value]' \
            --output text |
          while IFS=$'\t' read -r name value; do
            key="${name##*/}"
            printf '%s=%s\n' "$key" "$value"
          done > .env.build

          while IFS= read -r line; do
            val="${line#*=}"
            if [ -n "$val" ]; then
              echo "::add-mask::$val"
            fi
          done < .env.build

          if [ ! -s .env.build ]; then
            echo "::error::No parameters loaded from SSM. Check the path and IAM permissions."
            exit 1
          fi

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          secret-files: |
            env=./.env.build

      - name: Remove temporary environment file
        if: always()
        run: rm -f .env.build
